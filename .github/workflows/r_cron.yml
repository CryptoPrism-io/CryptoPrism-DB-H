name: Rscript_1h

on:
  schedule:
    - cron: "1 * * * *"  # Runs every hour at :01
  workflow_dispatch: {}

jobs:
  hourly-data-collection:
    runs-on: ubuntu-latest
    environment: production  # Use environment for secrets management

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          install-r: true

      # Install R packages
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("crypto2", "dplyr", "DBI", "RPostgres", "dotenv"))'

      # Run R script with environment variables
      - name: Run hourly OHLCV data collection
        env:
          # Database configuration
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_NAME_BT: ${{ secrets.DB_NAME_BT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}

          # Mark as GitHub Actions environment
          GITHUB_ACTIONS: true
        run: |
          Rscript gcp_postgres_sandbox/data_ingestion/gcp_ohlcv_1h_250coins.R

      - name: Log completion
        if: success()
        run: echo "✅ Hourly OHLCV data collection completed successfully"

      - name: Log failure
        if: failure()
        run: echo "❌ Hourly OHLCV data collection failed"
